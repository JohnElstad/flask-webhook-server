services:
  - type: web
    name: flask-webhook-server
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python flask_webhook_server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      - key: FLASK_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
